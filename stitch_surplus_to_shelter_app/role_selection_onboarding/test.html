                        "secondary": "#334155",

    <style>
        @layer base {

            html,
            body {
                width: 100%;
                min-height: 100%;
                margin: 0;
                padding: 0;
            }

            body {
                overscroll-behavior-y: none;
            }

            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }

            .pt-safe {
                padding-top: env(safe-area-inset-top, 0px);
            }

            main>:first-child {
                margin-top: 0 !important;
            }

            main>:last-child {
                margin-bottom: 0 !important;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen">
    <main class="flex-1 flex flex-col relative w-full bg-[#f8fafc] pt-safe pb-safe">
        <div class="flex flex-col w-full"><!-- Outer Ambient Textured Wrapper -->
            <div class="min-h-screen w-full flex flex-col justify-between relative overflow-hidden bg-[#e77a5b]">
                <div
                    class="relative pt-10 pb-8 px-6 text-center flex flex-1 flex-col items-center justify-center min-h-[190px]">
                    <div
                        class="absolute -left-12 -bottom-6 w-44 h-44 rounded-full bg-[#dfb268] opacity-80 mix-blend-multiply pointer-events-none">
                    </div>
                    <div
                        class="absolute -right-14 -bottom-10 w-52 h-52 rounded-full bg-[#52b788] opacity-80 mix-blend-multiply pointer-events-none">
                    </div>
                    <div class="absolute inset-0 bg-white/5 pointer-events-none"></div>
                    <div class="relative z-10 flex flex-col items-center">
                        <div
                            class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/20 backdrop-blur-md text-white text-[12px] font-semibold mb-2 shadow-xs border border-white/25">
                            <span class="">Surplus-to-Shelter</span><span class="opacity-60">•</span><span class="">Food
                                Rescue</span>
                        </div>
                        <h1 class="text-[32px] leading-tight font-extrabold text-white tracking-tight drop-shadow-sm">
                            Create an<br>account</h1>
                    </div>
                </div>
                <div
                    class="w-full flex-0 bg-white rounded-t-[36px] px-6 pt-7 pb-8 flex flex-col justify-between shadow-inner relative z-10">
                    <form class="flex flex-col gap-3 pt-2" onsubmit="event.preventDefault();">
                        <div class="relative flex items-center"><select
                                class="w-full h-[48px] pl-4 pr-10 rounded-2xl bg-[#f2f4f7] border-0 focus:ring-2 focus:ring-slate-300 text-slate-800 text-[14px] font-medium transition-all outline-none appearance-none cursor-pointer">
                                <option selected="" value="donor">Donor (Restaurants, caterers &amp; grocers)</option>
                                <option value="shelter">Shelter / Recipient (Care Homes &amp; Kitchens)</option>
                                <option value="rider">Rider (Volunteer &amp; gig rescue riders)</option>
                                <option value="admin">Admin (Dispatchers &amp; hub operations)</option>
                            </select>
                            <div class="absolute right-3.5 pointer-events-none text-slate-400 flex items-center">
                                <!-- <span class="material-symbols-outlined text-[20px]">expand_more</span> -->
                            </div>
                        </div>
                        <div
                            class="flex items-center bg-[#f2f4f7] rounded-2xl px-3.5 h-[48px] focus-within:ring-2 focus-within:ring-slate-300 transition-all">
                            <div
                                class="flex items-center gap-1 text-slate-700 pr-2 border-r border-slate-200/80 mr-2 text-[14px] font-semibold select-none">
                                <span class="text-base">🇮🇳</span><span class="">+91</span>
                            </div><input
                                class="w-full bg-transparent border-0 outline-none text-slate-800 placeholder:text-slate-400 text-[14px] font-medium tracking-wide p-0 focus:ring-0"
                                inputmode="numeric" maxlength="10" placeholder="98765 43210" type="tel">
                        </div><button
                            class="w-full h-[50px] mt-2 rounded-full bg-[#111827] hover:bg-black text-white font-bold text-[15px] flex items-center justify-center gap-2 shadow-lg shadow-black/15 active:scale-[0.98] transition-all duration-150"
                            type="submit"><span class="">Login</span></button>
                    </form>
                    <div class="mt-auto flex flex-col">
                        <p class="text-[12px] leading-relaxed text-slate-400 text-center mt-5 px-4 font-normal">Signing
                            up means you agree to our <a
                                class="underline text-slate-700 hover:text-slate-900 font-medium"
                                href="#privacy">Privacy Policy</a> and <a
                                class="underline text-slate-700 hover:text-slate-900 font-medium" href="#terms">Terms of
                                Service</a>.</p>
                        <div class="mt-4 pt-1 text-center"><span class="text-[14px] text-slate-700 font-medium">Have an
                                account? <a class="font-semibold text-slate-900 underline hover:text-black"
                                    href="#login">Log in here</a></span></div>
                    </div>
                </div>
            </div>
        </div>
        <script>
            (function () {
                const roleCards = document.querySelectorAll('.role-card');
                const phoneInput = document.getElementById('phoneInput');
                const clearPhone = document.getElementById('clearPhone');
                const continueBtn = document.getElementById('continueBtn');
                const otpBox = document.getElementById('otpBox');

                roleCards.forEach(card => {
                    card.addEventListener('click', () => {
                        roleCards.forEach(c => {
                            c.classList.remove('ring-2', 'ring-[#64748B]', 'bg-gradient-to-b', 'from-slate-100/60', 'to-white', 'shadow-md');
                            c.classList.add('shadow-sm', 'border', 'border-slate-200');
                            const ind = c.querySelector('.check-indicator');
                            if (ind) {
                                ind.classList.add('hidden');
                                ind.classList.remove('bg-[#64748B]');
                                ind.classList.add('bg-slate-200');
                                const icon = ind.querySelector('.material-symbols-outlined');
                                if (icon) {
                                    icon.classList.remove('text-white');
                                    icon.classList.add('text-slate-600');
                                    icon.style.fontVariationSettings = "'FILL' 0";
                                }
                            }
                        });

                        card.classList.remove('border', 'border-slate-200', 'shadow-sm');
                        card.classList.add('ring-2', 'ring-[#64748B]', 'bg-gradient-to-b', 'from-slate-100/60', 'to-white', 'shadow-md');
                        const activeInd = card.querySelector('.check-indicator');
                        if (activeInd) {
                            activeInd.classList.remove('hidden', 'bg-slate-200');
                            activeInd.classList.add('bg-[#64748B]');
                            const icon = activeInd.querySelector('.material-symbols-outlined');
                            if (icon) {
                                icon.classList.add('text-white');
                                icon.classList.remove('text-slate-600');
                                icon.style.fontVariationSettings = "'FILL' 1";
                            }
                        }
                    });
                });

                if (phoneInput) {
                    phoneInput.addEventListener('input', (e) => {
                        const val = e.target.value.replace(/\D/g, '');
                        e.target.value = val;
                        if (clearPhone) {
                            if (val.length > 0) {
                                clearPhone.classList.remove('hidden');
                            } else {
                                clearPhone.classList.add('hidden');
                            }
                        }
                    });
                }

                if (clearPhone && phoneInput) {
                    clearPhone.addEventListener('click', () => {
                        phoneInput.value = '';
                        clearPhone.classList.add('hidden');
                        phoneInput.focus();
                    });
                }

                if (continueBtn && otpBox) {
                    continueBtn.addEventListener('click', () => {
                        if (otpBox.classList.contains('hidden')) {
                            otpBox.classList.remove('hidden');
                            continueBtn.querySelector('span').textContent = 'Verify & Enter Feed';
                            const firstOtp = otpBox.querySelector('input');
                            if (firstOtp) firstOtp.focus();
                        }
                    });
                }
            })();
        </script>
    </main>

</body>

</html>
